services:
  - type: web
    name: vku-facility-inspection
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vku-facility-inspection-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"

databases:
  - name: vku-facility-inspection-db
    databaseName: vku_inspect
    user: vku_inspect
    plan: free
    region: singapore
